# Backstage catalog-info.yaml skeleton (Component kind — the common case).
# Only include optional keys that have a real value. Do not write empty
# lists, empty strings, or placeholder text into the final file.

apiVersion: backstage.io/v1alpha1
kind: Component               # Component | API | Resource | System | Domain | Location (see skill.md §Kind)
metadata:
  name: ""                    # required. lowercase, alnum + hyphens, DNS-safe, <= 63 chars
  title: ""                   # optional. human-readable display name if different from name
  description: ""             # optional but strongly recommended
  annotations:
    github.com/project-slug: "" # org/repo, derived from `git remote get-url origin`
    backstage.io/techdocs-ref: "" # e.g. "dir:." — only if TechDocs is enabled
  tags: []                    # optional, lowercase, e.g. [typescript, react]
  links: []                   # optional: [{url: "", title: "", icon: ""}]
spec:
  type: ""                    # required. one of: service | website | library | documentation | tool | other
  lifecycle: ""                # required. one of: experimental | production | deprecated
  owner: ""                    # required. e.g. group:default/<team> or user:default/<username>
  system: ""                   # optional. only if the repo is registered under an existing System entity
  dependsOn: []                # optional. e.g. [resource:default/some-db, component:default/other-svc]
  providesApis: []             # optional. e.g. [api:default/some-api]
  consumesApis: []             # optional. e.g. [api:default/some-api]

---
# Multi-component repo, single root file layout (skill.md §Step 0):
# one catalog-info.yaml at repo root, multiple `---`-separated documents,
# one fully self-contained entity per component directory.

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ""                    # e.g. "myrepo-api" — disambiguate collisions with the dir name
  description: ""
  annotations:
    github.com/project-slug: ""                # same repo slug for every component
    backstage.io/source-location: "url:<repo-url>/tree/<default-branch>/api" # points at the subdirectory
spec:
  type: service
  lifecycle: ""
  owner: ""
  providesApis: []             # e.g. [api:default/myrepo-api] if paired with an API kind entity

---

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ""                    # e.g. "myrepo-app"
  description: ""
  annotations:
    github.com/project-slug: ""
    backstage.io/source-location: "url:<repo-url>/tree/<default-branch>/app"
spec:
  type: website
  lifecycle: ""
  owner: ""                    # may differ from the sibling component's owner — confirm per-component
  consumesApis: []             # only if the user confirms this component actually calls the other, e.g. [api:default/myrepo-api]

# Per-directory layout alternative: instead of the above, write app/catalog-info.yaml
# and api/catalog-info.yaml as two independent single-entity files (each shaped like
# the Component skeleton above this line), plus a root catalog-info.yaml:
#
# apiVersion: backstage.io/v1alpha1
# kind: Location
# metadata:
#   name: ""                   # e.g. "myrepo"
# spec:
#   targets:
#     - ./app/catalog-info.yaml
#     - ./api/catalog-info.yaml
